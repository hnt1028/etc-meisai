name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: |
          set +e
          flutter analyze | tee analyze.txt
          status=${PIPESTATUS[0]}
          bash .github/scripts/annotate-analyze.sh analyze.txt
          exit "$status"

      - name: Test
        run: |
          set +e
          flutter test --machine > test.json
          status=$?
          bash .github/scripts/summarize-tests.sh test.json
          exit "$status"
