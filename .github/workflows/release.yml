name: Release

# A push of a release/* branch builds the signed APK, then makes the tag and a
# draft GitHub Release with the APK attached. See docs/release.md.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          if [ -z "$name" ]; then
            echo "version is not found in pubspec.yaml" >&2
            exit 1
          fi
          echo "tag=v$name" >> "$GITHUB_OUTPUT"

      - name: Stop when the tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null; then
            echo "tag ${{ steps.version.outputs.tag }} already exists. Change the version in pubspec.yaml." >&2
            exit 1
          fi

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "secret RELEASE_KEYSTORE_BASE64 is not set (docs/release.md)" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "etc-meisai-${{ steps.version.outputs.tag }}.apk"

      - name: Make the tag and the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" "etc-meisai-$tag.apk" \
            --draft --verify-tag --title "$tag" \
            --notes "リリース $tag（ブランチ: ${GITHUB_REF_NAME}）。確認してから公開する。"
